name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, lint, and check R8 release build
        run: |
          chmod +x gradlew
          if ! ./gradlew --no-daemon --stacktrace --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleQaRelease; then
            echo "::group::Android lint report (all issues)"
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              cat app/build/reports/lint-results-debug.txt
            else
              echo "Lint report missing; see Gradle output above."
            fi
            echo "::endgroup::"
            exit 1
          fi
      - name: Verify QA debug signature and record checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)
          QA="app/build/outputs/apk/qaRelease/app-qaRelease.apk"
          test -s "$QA"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$QA"
          (cd app/build/outputs/apk/qaRelease && sha256sum app-qaRelease.apk > SHA256SUMS.txt)
      # Only encrypted blobs are archived for public-repository test builds.
      # The recipient private key MUST NOT be committed or added to CI secrets.
      - name: Encrypt private test APKs for the intended recipient
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-artifacts
          for variant in debug qaRelease; do
            APK="app/build/outputs/apk/$variant/app-$variant.apk"
            [[ -s "$APK" ]]
            openssl cms -encrypt -binary -aes-256-cbc -outform DER \
              -recip .github/test-apk-recipient.crt \
              -in "$APK" -out "encrypted-artifacts/$variant.apk.p7m"
            echo "Plaintext SHA256 ($variant):"
            sha256sum "$APK"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: encrypted-android-testing
          path: encrypted-artifacts/*.p7m
          if-no-files-found: error
          retention-days: 3

      # Public GitHub repositories do not provide private artifact access.
      # Only private repositories may upload debug or QA APKs.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.repository.private }}
        with:
          name: android-builds-for-testing
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/qaRelease/*.apk
            app/build/outputs/apk/qaRelease/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

  emulator-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Enable Linux KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 emulator install, instrumented tests and launch smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest :app:assembleQaRelease
            # Exercise the R8-minified QA binary, not only the unminified debug variant.
            adb install -r app/build/outputs/apk/qaRelease/app-qaRelease.apk
            adb logcat -c
            mkdir -p emulator-artifacts
            adb shell am force-stop fr.angel.dynamicisland
            adb shell am start -W -n fr.angel.dynamicisland/.MainActivity | tee emulator-artifacts/startup.txt
            sleep 5
            adb shell pidof fr.angel.dynamicisland
            adb shell dumpsys meminfo fr.angel.dynamicisland > emulator-artifacts/meminfo.txt
            adb shell dumpsys gfxinfo fr.angel.dynamicisland framestats > emulator-artifacts/frame-stats.txt
            adb exec-out screencap -p > emulator-artifacts/first-launch.png
            adb logcat -d -s AndroidRuntime:E > emulator-artifacts/android-runtime.log
            ! grep -q 'FATAL EXCEPTION' emulator-artifacts/android-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            emulator-artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
