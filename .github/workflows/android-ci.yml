name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, lint, and check R8 release build
        run: |
          chmod +x gradlew
          if ! ./gradlew --no-daemon --stacktrace --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease; then
            echo "::group::Android lint report (all issues)"
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              cat app/build/reports/lint-results-debug.txt
            else
              echo "Lint report missing; see Gradle output above."
            fi
            echo "::endgroup::"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-builds-for-testing
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

  emulator-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Linux KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 emulator install, instrumented tests and launch smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n fr.angel.dynamicisland/.MainActivity
            sleep 5
            adb shell pidof fr.angel.dynamicisland
            mkdir -p emulator-artifacts
            adb exec-out screencap -p > emulator-artifacts/first-launch.png
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -s AndroidRuntime:E | tail -100
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            emulator-artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
